  bootstrap_alpha_lower_min: 0.0
  sharpe_improvement_min: 0.15
  max_drawdown_improvement_min: 0.15
  positive_fold_fraction_min: 0.60
  robust_seed_parameter_fraction_min: 0.70
  best_year_alpha_share_max: 0.50

neural_increment_thresholds:
  annual_alpha_increment_min: 0.005
  sharpe_increment_min: 0.10
  significance_level: 0.10

parameter_robustness:
  caitong_signal_thresholds: [0.45, 0.50, 0.55]
  zhongyou_kelly_lookbacks: [10, 15, 20]
