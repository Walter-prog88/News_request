  - {id: VIXCLS, group: risk_credit, frequency: daily}
  - {id: BAMLH0A0HYM2, group: risk_credit, frequency: daily}
  - {id: DTWEXBGS, group: dollar_commodity, frequency: daily}
  - {id: DCOILWTICO, group: dollar_commodity, frequency: daily}
  - {id: ICSA, group: high_frequency_economy, frequency: weekly, use_alfred_vintage: true}
  - {id: CPIAUCSL, group: low_frequency_macro, frequency: monthly, use_alfred_vintage: true}
  - {id: INDPRO, group: low_frequency_macro, frequency: monthly, use_alfred_vintage: true}
