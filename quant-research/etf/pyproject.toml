[project]
name = "index-timing"
version = "0.1.0"
description = "研报约束下的指数择时重构、独立验证与跨市场迁移研究"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "akshare>=1.17.0",
  "arch>=7.2.0",
  "duckdb>=1.3.0",
  "exchange-calendars>=4.8",
  "fredapi>=0.5.2",
  "hmmlearn>=0.3.3",
  "jinja2>=3.1.6",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=6.0",
  "pyarrow>=19.0",
  "pydantic>=2.10",
  "pyyaml>=6.0.2",
  "rich>=14.0",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "statsmodels>=0.14.4",
  "streamlit>=1.45",
  "torch>=2.6",
  "typer>=0.15",
  "yfinance>=0.2.61",
]

[project.optional-dependencies]
pro = ["tushare>=1.4.21"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.1",
  "ruff>=0.11",
]

[project.scripts]
index-timing = "index_timing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/index_timing"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "network: tests that require live public data providers",
  "slow: computationally intensive research tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

